<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#1e2d3d" stroke-width="0.4"></path>
    </pattern>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"></stop>
      <stop offset="100%" stop-color="#05050a" stop-opacity="0.8"></stop>
    </radialGradient>
  </defs>

  
  <rect width="100" height="100" rx="12" fill="#05050a"></rect>
  
  <rect width="100" height="100" rx="12" fill="url(#grid)"></rect>
  
  <rect width="100" height="100" rx="12" fill="url(#vignette)"></rect>

  
  <rect x="12" y="8" width="76" height="1.5" rx="1" fill="#00d4ff" opacity="0.6"></rect>
  
  <rect x="12" y="90" width="76" height="1.5" rx="1" fill="#00d4ff" opacity="0.6"></rect>

  
  <g filter="url(#glow)" stroke="#00d4ff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <path d="M 22 16 L 38 16"></path>
    <path d="M 30 16 L 30 68 Q 30 84 16 84"></path>

    
    <path d="M 42 16 L 42 84"></path>
    <path d="M 42 50 L 66 16"></path>
    <path d="M 42 50 L 66 84"></path>
  </g>

  
  <g fill="none" stroke="#0078d4" stroke-width="1.5" opacity="0.5">
    
    <path d="M 4 16 L 4 4 L 16 4"></path>
    
    <path d="M 84 4 L 96 4 L 96 16"></path>
    
    <path d="M 4 84 L 4 96 L 16 96"></path>
    
    <path d="M 84 96 L 96 96 L 96 84"></path>
  </g>
</svg>