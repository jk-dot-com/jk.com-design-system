<!-- @dsCard group="Components" viewport="700x640" name="Core" subtitle="Buttons, chips, cards, terminal fields & the status readout" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin:0; background:var(--color-bg); padding:24px; }
  .grp { margin-bottom:22px; }
  .lbl { font-family:var(--font-mono); font-size:9px; color:var(--color-text-ghost); letter-spacing:.15em; text-transform:uppercase; margin-bottom:10px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Button, Chip, BracketTag, SectionLabel, Card, ServiceCard, StatBlock, TerminalField, StatusReadout } = window.PhosphorousDesignSystem_97d119;
    function Demo() {
      return (
        <>
          <div className="grp">
            <div className="lbl">Buttons — primary · outline · red · iridescent</div>
            <div className="row">
              <Button variant="primary">View Services</Button>
              <Button variant="outline">Blog →</Button>
              <Button variant="red" iridescent>Book Me</Button>
              <Button variant="outline" size="sm">Small</Button>
            </div>
          </div>

          <div className="grp">
            <div className="lbl">Chips & Bracket tags</div>
            <div className="row">
              <Chip>Azure</Chip>
              <Chip>Cloudflare</Chip>
              <Chip color="var(--color-primary)" borderColor="rgba(0,120,212,0.3)">Zero Trust</Chip>
              <BracketTag>Rust & WASM</BracketTag>
              <BracketTag>AI Engineer</BracketTag>
            </div>
          </div>

          <div className="grp">
            <SectionLabel>Services</SectionLabel>
            <div className="grid2">
              <ServiceCard icon="▸" title="Azure Architecture"
                description="Landing zones, AKS, identity, and FinOps — end to end."
                tags={['Azure','AKS','Bicep']} />
              <Card>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                  <Chip color="var(--color-primary)" borderColor="rgba(0,120,212,0.3)">Azure Migration</Chip>
                  <StatBlock stat="40%" label="Cost reduction" />
                </div>
                <h3 style={{font:'var(--type-h3)',margin:'12px 0 4px'}}>Fortune 500 → Azure</h3>
                <p style={{fontSize:'.8rem',color:'var(--color-text-dim)',margin:0,lineHeight:1.5}}>200-node on-prem migration to Azure Landing Zones.</p>
              </Card>
            </div>
          </div>

          <div className="grp">
            <div className="lbl">Terminal fields & status readout</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'14px',marginBottom:'14px'}}>
              <TerminalField label="Name" required placeholder="Jane Smith" />
              <TerminalField label="Email" required placeholder="jane@company.com" />
            </div>
            <StatusReadout segments={['LOCATION: SILICON VALLEY','STATUS: AVAILABLE']} />
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
