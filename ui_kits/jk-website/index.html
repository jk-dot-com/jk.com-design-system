<!-- @dsCard group="JK Website" viewport="1280x720" name="jk.com — Full Site" subtitle="Interactive one-page recreation: hero, about, services, portfolio, contact" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JK.com — Unbounded Imagination</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; height: 100%; }
  #kit-scroll { height: 100vh; overflow-y: auto; scroll-behavior: smooth; }

  /* Hero glitch headline */
  .kit-glitch { font-size: clamp(3.5rem, 11vw, 8rem); }
  .gradient-text.text-glow { font-size: clamp(3.5rem, 11vw, 8rem); }
  .kit-glitch::before, .kit-glitch::after {
    content: attr(data-text); position: absolute; left: 0; right: 0; top: 0;
    font-family: var(--font-heading); font-weight: 900;
  }
  .kit-glitch::before { color: var(--color-cyan); animation: phos-glitch-1 8s steps(1) infinite; opacity: .6; }
  .kit-glitch::after { color: var(--color-pink); animation: phos-glitch-2 8s steps(1) infinite; opacity: .4; }

  /* CRT subtitle */
  .kit-crt-line {
    font-family: var(--font-mono); color: var(--color-cyan); font-size: 1.25rem;
    letter-spacing: .3em; text-transform: uppercase; display: inline-block;
    text-shadow: 0 0 4px #fff, 0 0 8px var(--color-cyan), 0 0 16px var(--color-cyan), 0 0 32px rgba(0,212,255,.4);
    margin: 0;
  }
  .kit-crt-cursor { color: var(--color-cyan); text-shadow: 0 0 8px var(--color-cyan); animation: phos-cursor-blink 1.1s step-end infinite; margin-left: 1px; }

  /* Status readout */
  .kit-status { display: inline-flex; align-items: center; gap: .5rem; font-family: var(--font-mono);
    font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; padding: .45rem 1rem;
    border: 1px solid rgba(0,212,255,.15); border-radius: 3px; background: rgba(0,212,255,.03); }
  .kit-status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-cyan); flex-shrink: 0;
    box-shadow: 0 0 6px var(--color-cyan), 0 0 12px rgba(0,212,255,.4); animation: phos-status-pulse 2s ease-in-out infinite; }

  /* Bracket tags */
  .kit-bracket-tag { display: inline-flex; align-items: center; gap: .3rem; padding: .3rem .7rem; border-radius: 3px;
    border: 1px solid rgba(0,212,255,.2); background: rgba(0,212,255,.04); color: var(--color-cyan-dim);
    font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase;
    transition: border-color .25s, color .25s, box-shadow .25s; cursor: default; }
  .kit-bracket-tag:hover { border-color: rgba(0,212,255,.5); color: var(--color-cyan); box-shadow: 0 0 10px rgba(0,212,255,.15); }
  .kit-bracket { color: var(--color-cyan); opacity: .5; font-weight: 300; }
  .kit-bracket-tag:hover .kit-bracket { opacity: 1; }

  .kit-nav-cursor { color: var(--color-cyan); font-family: var(--font-mono); animation: phos-cursor-blink 1s step-end infinite; margin-left: 1px; }
  .kit-bounce { animation: kit-bounce 1.4s ease-in-out infinite; }
  @keyframes kit-bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }

  /* Layout grids — desktop-first (1280 design width) */
  .kit-desktop-nav { display: flex; }
  .kit-burger { display: none; }
  .kit-mobile-menu { display: none; }
  .kit-about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6rem; align-items: start; }
  .kit-expertise-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  .kit-services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; align-items: start; }
  .kit-portfolio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  .kit-contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5rem; align-items: start; }
  .kit-quickstart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  .kit-footer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.5rem; align-items: start; }
  .kit-footer-bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

  /* Terminal fields */
  .kit-tf { display: flex; align-items: center; gap: .5rem; background: var(--color-surface);
    border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 0 .75rem; transition: border-color .2s, box-shadow .2s; }
  .kit-tf:focus-within { border-color: var(--color-cyan); box-shadow: 0 0 0 1px var(--color-cyan), 0 0 8px rgba(0,212,255,.2); }
  .kit-tf-multi { align-items: flex-start; padding-top: .75rem; }
  .kit-tf-prompt { color: var(--color-cyan); font-family: var(--font-mono); font-size: .85rem; opacity: .7; flex-shrink: 0; }
  .kit-tf-input { flex: 1; width: 100%; background: transparent; border: none; outline: none; color: var(--color-text);
    font-family: var(--font-mono); font-size: .875rem; padding: .75rem 0; }
  .kit-tf-input::placeholder { color: var(--color-text-ghost); opacity: .6; }

  /* Marquee */
  .kit-marquee { overflow: hidden; border-radius: .85rem; padding: 1rem;
    background: radial-gradient(circle at 50% 0%, rgba(0,212,255,.12), transparent 55%), rgba(0,212,255,.03);
    border: 1px solid rgba(0,212,255,.2); box-shadow: inset 0 0 0 1px rgba(0,212,255,.08), 0 0 18px rgba(0,212,255,.08); }
  .kit-marquee-track { display: flex; width: max-content; gap: .75rem; animation: kit-marquee 24s linear infinite; }
  .kit-marquee:hover .kit-marquee-track { animation-play-state: paused; }
  @keyframes kit-marquee { from { transform: translateX(0); } to { transform: translateX(calc(-50% - .375rem)); } }

  /* Footer status bar */
  .kit-sys-status { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; justify-content: center;
    padding: .6rem 0 .8rem; font-family: var(--font-mono); font-size: .6rem; letter-spacing: .12em; text-transform: uppercase; }
  .kit-sys-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--color-cyan); box-shadow: 0 0 4px var(--color-cyan); animation: phos-status-pulse 2s ease-in-out infinite; }
  .kit-sys-text { color: var(--color-text-dim); opacity: .6; }
  .kit-sys-sep { color: var(--color-text-ghost); opacity: .4; }

  @media (max-width: 860px) {
    .kit-desktop-nav { display: none; }
    .kit-burger { display: flex; }
    .kit-mobile-menu { display: block; }
    .kit-about-grid, .kit-expertise-grid, .kit-services-grid, .kit-portfolio-grid,
    .kit-contact-grid, .kit-quickstart-grid, .kit-footer-grid { grid-template-columns: 1fr; gap: 1.5rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .kit-glitch::before, .kit-glitch::after, .kit-crt-cursor, .kit-nav-cursor,
    .kit-status-dot, .kit-sys-dot, .kit-bounce, .kit-marquee-track { animation: none; }
  }
</style>
</head>
<body>
<div id="kit-scroll"></div>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="About.jsx"></script>
<script type="text/babel" src="Services.jsx"></script>
<script type="text/babel" src="Portfolio.jsx"></script>
<script type="text/babel" src="Contact.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel">
  function Site() {
    return (
      <>
        <Header />
        <Hero />
        <About />
        <Services />
        <Portfolio />
        <Contact />
        <Footer />
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('kit-scroll')).render(<Site />);
</script>
</body>
</html>
