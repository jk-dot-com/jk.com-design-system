<!-- @dsCard group="Brand" viewport="700x160" name="Logo — JK Monogram" subtitle="Glowing cyan monogram on CRT grid with corner brackets" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--color-bg); padding:24px; display:flex; align-items:center; gap:28px; }
  img { width:96px; height:96px; filter:drop-shadow(0 0 8px rgba(0,212,255,.6)); }
  .wordmark { font-family:var(--font-heading); font-weight:900; font-size:40px; letter-spacing:-.02em; color:var(--color-text); }
  .meta { font-family:var(--font-mono); font-size:10px; color:var(--color-text-ghost); letter-spacing:.08em; margin-top:8px; }
</style>
</head>
<body>
  <img src="../public/favicon.svg" alt="JK.com logo">
  <div>
    <div class="wordmark">JK<span class="gradient-text">.com</span></div>
    <div class="meta">favicon.svg · drop-shadow glow · gradient-text wordmark</div>
  </div>
</body>
</html>
