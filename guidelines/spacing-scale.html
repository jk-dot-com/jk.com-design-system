<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing Scale" subtitle="Base-4 rhythm — generous, grid-aligned section padding" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--color-bg); padding:24px; display:flex; align-items:flex-end; gap:14px; }
  .item { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .bar { background:linear-gradient(to top,var(--color-cyan),var(--color-cyan-dim)); width:22px; border-radius:2px 2px 0 0; box-shadow:var(--glow-cyan-sm); }
  .t { font-family:var(--font-mono); font-size:9px; color:var(--color-text-dim); letter-spacing:.04em; }
</style>
</head>
<body>
  <div class="item"><div class="bar" style="height:8px"></div><span class="t">2 · 8</span></div>
  <div class="item"><div class="bar" style="height:16px"></div><span class="t">4 · 16</span></div>
  <div class="item"><div class="bar" style="height:24px"></div><span class="t">6 · 24</span></div>
  <div class="item"><div class="bar" style="height:32px"></div><span class="t">8 · 32</span></div>
  <div class="item"><div class="bar" style="height:48px"></div><span class="t">12 · 48</span></div>
  <div class="item"><div class="bar" style="height:64px"></div><span class="t">16 · 64</span></div>
  <div class="item"><div class="bar" style="height:96px"></div><span class="t">24 · 96</span></div>
</body>
</html>
