<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--color-bg); padding:24px; display:flex; align-items:center; justify-content:center; }
  .status-readout { display:inline-flex; align-items:center; gap:.5rem; font-family:var(--font-mono);
    font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--color-text-ghost);
    padding:.45rem 1rem; border:1px solid rgba(0,212,255,.15); border-radius:3px; background:rgba(0,212,255,.03); }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--color-cyan);
    box-shadow:0 0 6px var(--color-cyan),0 0 12px rgba(0,212,255,.4); animation:phos-status-pulse 2s ease-in-out infinite; }
  .online { color:var(--color-cyan); font-weight:600; }
  .txt { color:var(--color-text-dim); }
  .sep { opacity:.3; font-size:.6rem; }
</style>
</head>
<body>
  <div class="status-readout">
    <span class="dot"></span>
    <span class="online">ONLINE</span>
    <span class="sep">//</span>
    <span class="txt">LOCATION: SILICON VALLEY</span>
    <span class="sep">//</span>
    <span class="txt">STATUS: AVAILABLE</span>
  </div>
</body>
</html>
