<!-- @dsCard group="Colors" viewport="700x150" name="Grounds & Surfaces" subtitle="Near-black grounds with a blue cast — the void to build on" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--color-bg); padding:20px; }
  .row { display:flex; gap:12px; }
  .sw { flex:1; height:96px; border-radius:var(--radius-lg); border:1px solid var(--color-border);
        display:flex; flex-direction:column; justify-content:flex-end; padding:10px; }
  .sw .name { font:var(--type-mono); color:var(--color-text); font-size:11px; }
  .sw .hex { font-family:var(--font-mono); color:var(--color-text-ghost); font-size:10px; letter-spacing:.05em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--color-bg)"><span class="name">bg</span><span class="hex">#05050a</span></div>
    <div class="sw" style="background:var(--color-surface)"><span class="name">surface</span><span class="hex">#0d1117</span></div>
    <div class="sw" style="background:var(--color-card)"><span class="name">card</span><span class="hex">#111827</span></div>
    <div class="sw" style="background:var(--color-card-hover)"><span class="name">card-hover</span><span class="hex">#161f2e</span></div>
    <div class="sw" style="background:var(--color-bg);border-color:var(--color-border)"><span class="name">border</span><span class="hex">#1e2d3d</span></div>
  </div>
</body>
</html>
