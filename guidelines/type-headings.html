<!-- @dsCard group="Type" viewport="700x230" name="Headings" subtitle="Space Grotesk, tight tracking, semibold-to-bold. h1 / h2 / h3" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--color-surface); padding:24px; display:flex; flex-direction:column; justify-content:center; gap:16px; }
  .h1 { font-family:var(--font-heading); font-weight:700; font-size:48px; line-height:1.1; letter-spacing:-.02em; color:var(--color-text); }
  .h2 { font-family:var(--font-heading); font-weight:700; font-size:36px; line-height:1.1; letter-spacing:-.02em; color:var(--color-text); }
  .h3 { font-family:var(--font-heading); font-weight:600; font-size:20px; line-height:1.4; color:var(--color-text); }
  .lbl { font-family:var(--font-mono); font-size:9px; color:var(--color-text-ghost); letter-spacing:.1em; margin-left:12px; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="h1">Work That Ships<span class="lbl">h1 · 5xl / 700</span></div>
  <div class="h2">What I Build &amp; Advise<span class="lbl">h2 · 4xl / 700</span></div>
  <div class="h3">Azure Solutions Architecture<span class="lbl">h3 · xl / 600</span></div>
</body>
</html>
